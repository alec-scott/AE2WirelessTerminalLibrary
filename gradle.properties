org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.caching=true

# Mod Properties
mavenGroup=de.mari_023
modID=ae2wtlib
ae2wtlibCurrentMajor=26
# Fabric port of the NeoForge 26.1 branch (see PORTING-26.1.md). Version = <upstream release>+fabric.<port build>
upstream_version=26.1.3-beta
port_build=1

# Fabric, Minecraft 26.1.2 (unobfuscated: no mappings, Loom does not remap)
minecraft_version=26.1.2
java_version=25
loom_version=1.17.20
fabric_loader_version=0.20.1
fabric_api_version=0.155.3+26.1.2

# AE2 for Fabric is the unofficial "Applied Energistics 2: Fabricated" port (mod id ae2, same appeng.api).
# It is not on a public maven: put the release jar in libs/ (gitignored).
ae2Version=26.1.13-beta.1+fabric
ae2Jar=libs/ae2-fabricated-26.1.13-beta.1+fabric.jar

# Optional integrations (compile-only)
reiVersion=26.1.819
jeiMinecraftVersion=26.1.2
jeiVersion=29.47.0.109
# EMI has no 26.x release; like AE2, the plugin is compiled against the 1.21.1 API
emiVersion=1.1.22
emiMinecraftVersion=1.21.1
clothConfigVersion=26.1.154
modMenuVersion=18.0.2
architecturyVersion=20.0.10
