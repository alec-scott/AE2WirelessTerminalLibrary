plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

allprojects {
    apply plugin: 'net.fabricmc.fabric-loom'

    group = mavenGroup
    version = "${ae2wtlibCurrentMajor}0.0.0-SNAPSHOT"
    def tag = System.getenv("TAG") ?: ""
    version = tag != "" ? tag : "${upstream_version}+fabric.${port_build}"

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven {
            url = 'https://maven.blamejared.com/'
            content { includeGroup 'mezz.jei' }
        }
        maven {
            url = 'https://maven.shedaniel.me/'
            content {
                includeGroup 'me.shedaniel'
                includeGroup 'me.shedaniel.cloth'
                includeGroup 'dev.architectury'
            }
        }
        maven {
            url = 'https://maven.terraformersmc.com/releases/'
            content {
                includeGroup 'dev.emi'
                includeGroup 'com.terraformersmc'
            }
        }
        mavenCentral()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        implementation files(rootProject.file(ae2Jar))
        // Team Reborn Energy is jar-in-jar inside AE2 Fabricated; needed on the compile classpath for its energy API
        compileOnly "teamreborn:energy:5.0.0"
        compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = java_version as int
        options.encoding = 'UTF-8'
        options.compilerArgs.addAll(['-Xmaxerrs', '10000'])
    }

    processResources {
        def props = [version: project.version, ae2_version: ae2Version, minecraft_version: minecraft_version,
                     fabric_loader_version: fabric_loader_version]
        inputs.properties(props)
        filesMatching('fabric.mod.json') { expand props }
    }
}

base { archivesName = 'ae2wtlib' }

loom {
    runs {
        configureEach { ideConfigGenerated = true }
        client { runDir = 'run' }
        server {
            runDir = 'run/server'
            vmArg '-Dae2wtlib.mixinAudit=true'
        }
    }
}

dependencies {
    implementation project(path: ':ae2wtlib_api')
    include project(path: ':ae2wtlib_api')

    compileOnly("me.shedaniel:RoughlyEnoughItems-api-fabric:${reiVersion}") { transitive = false }
    compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-fabric:${reiVersion}") { transitive = false }
    compileOnly("dev.architectury:architectury-fabric:${architecturyVersion}") { transitive = false }
    compileOnly "mezz.jei:jei-${jeiMinecraftVersion}-common-api:${jeiVersion}"
    compileOnly "mezz.jei:jei-${jeiMinecraftVersion}-fabric-api:${jeiVersion}"
    // the Fabric EMI 1.21.1 jar uses intermediary names; like AE2, compile against the Mojang-named NeoForge API
    compileOnly "dev.emi:emi-neoforge:${emiVersion}+${emiMinecraftVersion}:api"
    compileOnly("me.shedaniel.cloth:cloth-config-fabric:${clothConfigVersion}") { transitive = false }
    compileOnly("com.terraformersmc:modmenu:${modMenuVersion}") { transitive = false }
}

jar {
    from('LICENSE') { rename { "LICENSE_ae2wtlib" } }
}
